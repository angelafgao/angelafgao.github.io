<header class="site-header">
  <div class="wrap">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav">
      {% for item in site.data.nav %}
      {%- if page.url == item.url %}
      <a href="{{ item.url | relative_url }}" aria-current="page">{{ item.title }}<span class="nav-mark" aria-hidden="true"></span></a>
      {%- else %}
      <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
      {%- endif %}
      {% endfor %}
    </nav>
  </div>
</header>
