<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body class="{{ page.body_class }}">
  <div class="paper-layer" data-paper="site" aria-hidden="true"></div>
  <div class="page">
  {% include header.html %}
  <main>
    {{ content }}
  </main>
  <div class="footer-art" data-mode="{{ site.footer_animation | default: 'seismograph' }}"{% if jekyll.environment == "development" %} data-dev="true"{% endif %} aria-hidden="true"><canvas></canvas></div>
  {% include footer.html %}
  </div>
  {%- if jekyll.environment == "development" or site.footer_animation != "ripples" %}
  <script src="{{ '/assets/js/footer-art-extras.js' | relative_url }}" defer></script>
  {%- endif %}
  <script type="module" src="{{ '/assets/paper/paper.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/footer-art.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/lensing.js' | relative_url }}" defer></script>
  {% if jekyll.environment == "development" %}{% include font-lab.html %}{% endif %}
</body>
</html>
